name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          # Request OIDC token for npm
          scope: '@thumb2086'  # optional, but helps with provenance

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          # OIDC token automatically available via setup-node
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}  # fallback only